name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements.txt
          npm ci

      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium on macOS
        if: runner.os == 'macOS'
        run: npx playwright install chromium

      - name: Static checks
        run: |
          python -m py_compile scripts/validate_design_flow.py scripts/export_carousel.py tests/playwright_smoke.py
          npm run check:node

      - name: Unit tests
        run: npm run test:unit

      - name: Playwright carousel smoke
        run: npm run test:e2e
